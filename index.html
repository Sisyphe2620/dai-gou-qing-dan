<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的待办事项</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a phone-width column of flat colour bands; the open band unfolds its list like creased paper. */
:root{
  --paper:#F8F3EA; --card:#FFFFFF; --ink:#3A2B25; --ink-2:#6F5F55; --line:#E4DAC9; --crease:#EBE0CF;
  --gold:#F4B13B; --clay:#E0745E; --sand:#F2E6D6; --lime:#9EB823; --on-clay:#2A1A15;
  --display:'Jost','Noto Sans SC',system-ui,sans-serif;
  --body:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#E9DFCE;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;color-scheme:light;-webkit-text-size-adjust:100%}
.app{max-width:520px;min-height:100%;margin:0 auto;background:var(--paper);box-shadow:0 0 0 1px rgba(58,43,37,.06),0 24px 70px rgba(58,43,37,.14)}
.app.enter{animation:enter .3s ease-out}
@keyframes enter{from{opacity:0}to{opacity:1}}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* hero */
.hero{padding:18px 20px 28px;display:flex;flex-direction:column;gap:14px}
.hero h1{margin:0;font-size:30px;line-height:1.25;font-weight:700;letter-spacing:.02em;text-wrap:balance}
.hero p{margin:0;font-size:15px;line-height:1.75;max-width:34em}
.hero-sand{background:var(--sand);color:var(--ink)}
.hero-gold{background:var(--gold);color:var(--ink)}
.hero-clay{background:var(--clay);color:var(--on-clay)}
.back{align-self:flex-start;text-decoration:none;font-weight:500;font-size:15px;min-height:44px;display:inline-flex;align-items:center;margin:-6px 0 -2px -8px;padding:0 8px}
.stamp{display:flex;flex-direction:column;font-family:var(--display);padding-top:6px}
.stamp small{font-size:13px;letter-spacing:.16em;font-weight:500}
.stamp b{font-size:76px;line-height:.95;font-weight:300;font-variant-numeric:tabular-nums}

/* bands */
.band{display:flex;align-items:center;gap:18px;width:100%;min-height:96px;padding:20px;border:0;text-align:left;font:inherit;color:var(--ink);text-decoration:none;cursor:pointer;position:relative}
.band .num{font-family:var(--display);font-weight:300;font-size:46px;line-height:1;min-width:2ch;font-variant-numeric:tabular-nums}
.band h2{margin:0;font-size:19px;font-weight:700;letter-spacing:.04em}
.band p{margin:3px 0 0;font-size:13px;line-height:1.45}
.band .bar{margin-left:auto;flex:none;height:14px;background:rgba(255,255,255,.62);transition:width .3s}
.c-gold{background:var(--gold)}
.c-sand{background:var(--sand);box-shadow:inset 0 1px 0 rgba(58,43,37,.14),inset 0 -1px 0 rgba(58,43,37,.14)}
.c-sand .bar{background:var(--clay)}
.c-clay{background:var(--clay);color:var(--on-clay)}
.c-clay .bar{background:rgba(255,255,255,.55)}
.c-lime{background:var(--lime)}
.fold-band{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.fold-band::before{content:"";position:absolute;left:50%;bottom:7px;width:44px;height:4px;margin-left:-22px;background:currentColor;opacity:.3;border-radius:2px;transition:opacity .2s}
.fold-band[aria-expanded="true"]::before{opacity:.55}
.band-wrap{position:relative}
.band-clear{position:absolute;right:74px;top:50%;transform:translateY(-50%);display:none;height:36px;padding:0 12px;border:0;background:#fff;color:#9A3F2B;font-weight:700;font-size:14px;cursor:pointer;align-items:center;gap:6px;z-index:2}
.band-clear svg{display:block}
.band-wrap .fold-band[aria-expanded="true"]+.band-clear{display:inline-flex}
.band-wrap .fold-band[aria-expanded="true"] .bar{display:none}

/* add box */
.add{display:flex;gap:10px;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line)}
.add input{flex:1;min-width:0;height:48px;border:2px solid var(--line);border-radius:0;padding:0 12px;font:inherit;background:var(--paper);color:var(--ink)}
.add input:focus{outline:none;border-color:var(--ink)}
.add button{flex:none;height:48px;padding:0 18px;border:0;background:var(--ink);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.shop-cats{display:flex;gap:8px;align-items:center;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
.shop-cats span{font-size:14px;color:var(--ink-2)}
.add .mic{flex:none;width:48px;height:48px;padding:0;border:2px solid var(--line);background:var(--paper);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.add .mic.on{background:#C0392B;border-color:#C0392B;color:#fff;animation:micpulse 1.2s ease-in-out infinite}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.35)}50%{box-shadow:0 0 0 8px rgba(192,57,43,0)}}

/* folded list */
.panel{background:#fff;overflow:hidden}
.fold{transform-origin:50% 0;backface-visibility:hidden}
.fold-row{display:flex;align-items:center;gap:4px;min-height:64px;padding:6px 6px 6px 8px;transform-origin:50% 0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.fold-row:nth-child(odd){background:linear-gradient(#fff 0%,var(--crease) 100%)}
.fold-row:nth-child(even){background:linear-gradient(var(--crease) 0%,#fff 100%)}
.num{flex:none;width:48px;text-align:center;font-family:var(--display);font-weight:300;font-size:22px;line-height:1;color:var(--ink-2);font-variant-numeric:tabular-nums;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.done .num{color:#B9BFA9}
.t{flex:1;min-width:0;font-size:16px;line-height:1.45;overflow-wrap:anywhere;padding:4px 0}
.done .t{text-decoration:line-through;color:#8C9A96}
.today-btn{flex:none;height:34px;padding:0 12px;border:2px solid #D8CCB8;background:#fff;color:var(--ink-2);font-size:13px;font-weight:700;cursor:pointer}
.today-btn.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.del{flex:none;width:44px;height:44px;border:0;background:none;font-size:26px;line-height:1;color:var(--ink-2);cursor:pointer}
.edit-btn{flex:none;width:36px;height:36px;border:0;background:none;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.edit-btn svg{display:block}
.t .edit-input{display:block;width:100%;height:36px;padding:0 10px;border:2px solid var(--gold);border-radius:8px;font-size:16px;background:#fff;color:var(--ink);box-sizing:border-box;user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
.empty{padding:44px 24px;text-align:center;display:grid;gap:8px;background:#fff}
.empty strong{font-size:22px;font-weight:700}
.empty span{font-size:14px;color:var(--ink-2);line-height:1.7}

/* shopping */
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sand);border-bottom:1px solid var(--line)}
.stats div{padding:16px 8px;text-align:center;display:grid;gap:2px}
.stats div+div{border-left:1px solid var(--line)}
.stats b{font-family:var(--display);font-weight:300;font-size:42px;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--ink-2)}
.filters{padding:14px 16px 12px;background:#fff;border-bottom:1px solid var(--line);display:grid;gap:10px}
.fl{display:flex;gap:10px;align-items:center;min-width:0}
.fl .lab{flex:none;font-size:12px;color:var(--ink-2);width:4.2em;line-height:1.3}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 2px 0;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border:2px solid var(--line);background:#fff;font-size:14px;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.card{display:grid;grid-template-columns:104px minmax(0,1fr) 34px;gap:14px;padding:16px;background:#fff;border-bottom:1px solid var(--line);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.card-ctl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.chev,.dots{background:none;border:0;padding:6px;cursor:pointer;color:var(--ink-2);line-height:0}
.chev:disabled{opacity:.3;cursor:default}
.sheet-wrap{position:fixed;inset:0;z-index:10000;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet{position:relative;width:100%;max-width:480px;background:#fff;border-radius:18px 18px 0 0;padding:14px 16px 22px;box-sizing:border-box}
.sheet-title{font-weight:700;text-align:center;padding:6px 0 12px;font-size:15px;overflow-wrap:anywhere}
.sheet-opt{display:block;width:100%;height:50px;border:0;background:var(--sand);margin:0 0 8px;font-size:16px;font-weight:700;color:var(--ink);border-radius:12px;cursor:pointer}
.sheet-opt:disabled{opacity:.45;cursor:default}
.sheet-cancel{display:block;width:100%;height:50px;border:0;background:#fff;margin:0;font-size:16px;color:var(--ink);border-radius:12px;cursor:pointer}
.card:nth-child(odd){background:linear-gradient(#fff 0%,var(--crease) 100%)}
.card:nth-child(even){background:linear-gradient(var(--crease) 0%,#fff 100%)}
.pic{width:104px;aspect-ratio:3/4;border:0;padding:0;background:var(--paper);cursor:pointer;overflow:hidden;align-self:start}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:grid;place-items:center;align-content:center;gap:6px;height:100%;color:var(--ink-2);font-size:12px;font-weight:500}
.info h3{margin:0 0 6px;font-size:16px;line-height:1.4;font-weight:700;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{font-size:12px;font-weight:500;padding:1px 8px;background:var(--paper);color:var(--ink)}
.tag.place{background:var(--ink);color:#fff}
.tag.status{background:var(--gold);color:var(--ink)}
.price{font-family:var(--display);font-weight:600;font-size:17px;margin:0 0 6px}
.note{font-size:13.5px;line-height:1.65;color:var(--ink-2);margin:0 0 8px}
.meta{display:grid;gap:2px;margin:0 0 10px;font-size:12.5px;line-height:1.5}
.meta div{display:flex;gap:8px}
.meta dt{color:var(--ink-2);flex:none}
.meta dd{margin:0;font-weight:500}
.link{display:inline-block;margin-bottom:10px;font-weight:700;font-size:14px;text-underline-offset:3px;text-decoration-color:var(--clay);text-decoration-thickness:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.act{height:40px;padding:0 16px;border:0;background:var(--gold);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer}
.act.ghost{background:#fff;border:2px solid var(--clay);color:#9A3F2B}
.act:disabled{opacity:.35;cursor:default}
.clearbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.nomatch{padding:28px 20px;background:#fff;text-align:center;color:var(--ink-2);font-size:14px}
.howto{padding:28px 20px 44px;background:var(--sand);color:var(--ink);box-shadow:inset 0 1px 0 rgba(58,43,37,.14);margin-top:0}
.howto h4{margin:0 0 8px;font-size:15px;letter-spacing:.08em}
.howto p{margin:0;font-size:14px;line-height:1.85}
.home-bands{display:grid}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:min(440px,calc(100% - 32px));background:var(--ink);color:#fff;padding:12px 16px;font-size:14px;line-height:1.5;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){
  .app.enter{animation:none}
  .band .bar,.toast{transition:none}
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="sheet-backdrop" data-sheet="close"></div>
  <div class="sheet" role="dialog" aria-label="移动商品">
    <div class="sheet-title" id="sheetTitle"></div>
    <button type="button" class="sheet-opt" id="sheetToBuy" data-sheet="buy">移到待购买</button>
    <button type="button" class="sheet-opt" id="sheetToWait" data-sheet="wait">移到等折扣</button>
    <button type="button" class="sheet-cancel" data-sheet="close">取消</button>
  </div>
</div>
<input type="file" id="imgInput" accept="image/*" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var DAY=86400000;
  var HOWTO='在上面写要买的东西，点麦克风可以直接语音输入，选好「待购买」还是「等折扣」，点「添加」就记下来了。想补充购买地点、目标价这些细节，告诉我一声，我帮你改。买好了点卡片上的「已购买」，东西会进「已购清单」，7 天内可以恢复，超过 7 天自动删除；已购清单里的「清空」会一次删掉里面的全部东西。';

  var ITEMS=[
    {id:'metal-basin',cat:'buy',name:'金属带孔盆',place:'宜家',type:'厨具类',price:'待定',note:'去宜家买，具体款式和价格到店再定。'},
    {id:'snake-base',cat:'buy',name:'1/144 蛇骨磁吸底座支架（HG / RG 高达手办造型支架）',place:'淘宝',type:'玩具类',price:'待定',note:'1/144 比例蛇骨磁吸底座，给 HG / RG 高达手办摆造型、凹造型用。',link:'https://e.tb.cn/h.jndEh1dzYQU36P9?tk=3xEM6UbZsxS'},
    {id:'sand-grass',cat:'buy',name:'沙盘模型草皮（建筑模型 / 微景观草地造景 DIY 草坪）',place:'淘宝',type:'玩具类',price:'待定',note:'做建筑模型、室外微景观的草地草皮，DIY 手工模型造景用。',link:'https://e.tb.cn/h.jO0R4uAUsYodsNE?tk=aOyx6UbccXi'},
    {id:'gundam-stand',cat:'buy',name:'高达落地支架',place:'淘宝',type:'玩具类',price:'待定',note:'高达模型落地展示支架。'},
    {id:'black-cap',cat:'buy',name:'黑色棒球帽',type:'日用品',price:'待定',note:'Boxing Day（12 月 26 日）买一顶黑色棒球帽，款式和价格到时再定。',when:'Boxing Day'},
    {id:'stormtrooper',cat:'wait',name:'星战 50 周年黑系列 风暴兵 Kenner 复古卡版',type:'玩具类',price:'未定价',status:'等开订',next:'2026-11-23',img:'assets/stormtrooper-kenner.jpg',note:'还没开预购，预计 2027 年才上架（美国 Target / Walmart / Disney Store，海外走 Fan Channel）。普通金卡版已开预购，29.99 美元，2027 年春季发售。'},
    {id:'inart-batman',cat:'wait',name:'INART 绝对蝙蝠侠',type:'玩具类',price:'未定价',status:'等预售',next:'约 2026-12-05',img:'assets/batman-inart.jpg',note:'原型已于 2026 年 10 月 3–4 日在上海 Wonder Festival 展出，暂无官宣、无售价、无淘宝预售。'}
  ];
  var PLACES=['宜家','淘宝'];
  var TYPES=['玩具类','工具类','厨具类','日用品','食物'];

  /* ---------- storage ---------- */
  var K={todo:'todo-items-v1',bought:'daigou-purchased-v1',gone:'daigou-gone-v1',img:'daigou-img-v1',custom:'daigou-custom-v1',order:'daigou-order-v1',cat:'daigou-cat-v1'};
  function load(k,fb){try{var r=localStorage.getItem(k);if(r!==null)return JSON.parse(r)}catch(e){}return fb}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
  function isObj(v){return v&&typeof v==='object'&&!Array.isArray(v)}
  var todos=load(K.todo,[]); if(!Array.isArray(todos))todos=[];
  /* One-time seed (2026-11-22): the six todos he asked to put on
     today's list. Runs once — adds any that aren't already there
     (matched by exact text), then sets a flag so it never repeats. */
  if(!load('todo-seed-20261122',false)){
    var seed=['看一下房梁的聊天记录','看书','看CNC的教学','测试 Neon Block Pop 游戏','了解用像素贴图的方式做三维游戏','发布 Neon Block Pop 到网页游戏网站'];
    var have={}; todos.forEach(function(t){have[t.text]=1});
    var add=seed.filter(function(s){return !have[s]}).map(function(s){return {id:uid(),text:s,done:false,today:true}});
    todos=add.concat(todos);
    save(K.todo,todos); save('todo-seed-20261122',true);
  }
  /* One-time seed (2026-11-24): the todo he asked to put on
     today's list. Runs once — adds it if it isn't already there
     (matched by exact text), then sets a flag so it never repeats. */
  if(!load('todo-seed-20261124',false)){
    var seed=['制作五官弹射游戏（发射胡子🧔，发射长发👩，鼻毛，五官）'];
    var have={}; todos.forEach(function(t){have[t.text]=1});
    var add=seed.filter(function(s){return !have[s]}).map(function(s){return {id:uid(),text:s,done:false,today:true}});
    todos=add.concat(todos);
    save(K.todo,todos); save('todo-seed-20261124',true);
  }
  var bought=load(K.bought,{}); if(!isObj(bought))bought={};
  var gone=load(K.gone,[]); if(!Array.isArray(gone))gone=[];
  var imgs=load(K.img,{}); if(!isObj(imgs))imgs={};
  /* User-added shop items (from the in-page add form, incl. voice):
     kept in localStorage and merged with the built-in ITEMS. */
  var custom=load(K.custom,[]); if(!Array.isArray(custom))custom=[];
  function allItems(){return ITEMS.concat(custom)}

  /* Shop drag order + category overrides (drag a card to reorder, or
     across sections to switch 待购买 / 等折扣). Persisted in localStorage. */
  var shopOrder=load(K.order,{buy:[],wait:[]}); if(!isObj(shopOrder))shopOrder={buy:[],wait:[]};
  if(!Array.isArray(shopOrder.buy))shopOrder.buy=[];
  if(!Array.isArray(shopOrder.wait))shopOrder.wait=[];
  var catOv=load(K.cat,{}); if(!isObj(catOv))catOv={};
  function effCat(it){return catOv[it.id]||it.cat}
  function syncShopOrder(){
    var act=activeItems(),changed=false;
    ['buy','wait'].forEach(function(c){
      var cur=(shopOrder[c]||[]).filter(function(id){
        var it=act.filter(function(x){return x.id===id})[0];
        return it&&effCat(it)===c;
      });
      act.forEach(function(it){
        if(effCat(it)===c&&cur.indexOf(it.id)<0){cur.push(it.id);changed=true}
      });
      if(cur.length!==(shopOrder[c]||[]).length)changed=true;
      shopOrder[c]=cur;
    });
    Object.keys(catOv).forEach(function(id){
      if(!allItems().filter(function(x){return x.id===id})[0]){delete catOv[id];changed=true}
    });
    if(changed){save(K.order,shopOrder);save(K.cat,catOv)}
  }

  /* 旧版商品 id → 新版 id 映射（2026-11-21 换版时保留已购/换图数据；2026-11-22 补上顺序与分类覆盖，否则旧 id 会被 syncShopOrder 当成无效项丢掉、顺序每次重开都回到默认） */
  (function(){
    var MAP={'basin':'metal-basin','gundam-snake-stand':'snake-base','model-grass':'sand-grass','gundam-floor-stand':'gundam-stand','black-baseball-cap':'black-cap','stormtrooper-kenner':'stormtrooper','batman-inart':'inart-batman'};
    var changed=false;
    Object.keys(MAP).forEach(function(old){
      var nw=MAP[old];
      if(old in bought){bought[nw]=bought[old];delete bought[old];changed=true}
      var gi=gone.indexOf(old);
      if(gi>=0){gone.splice(gi,1);if(gone.indexOf(nw)<0)gone.push(nw);changed=true}
      if(old in imgs){imgs[nw]=imgs[old];delete imgs[old];changed=true}
      ['buy','wait'].forEach(function(c){
        var arr=shopOrder[c]||[];
        for(var k=0;k<arr.length;k++){if(arr[k]===old){arr[k]=nw;changed=true}}
      });
      if(old in catOv){catOv[nw]=catOv[old];delete catOv[old];changed=true}
    });
    if(changed){save(K.bought,bought);save(K.gone,gone);save(K.img,imgs);save(K.order,shopOrder);save(K.cat,catOv)}
  })();

  function expire(){
    var now=Date.now(),changed=false;
    Object.keys(bought).forEach(function(id){
      if(now-bought[id]>7*DAY){ if(gone.indexOf(id)<0)gone.push(id); delete bought[id]; changed=true; }
    });
    if(changed){save(K.bought,bought);save(K.gone,gone)}

  function confetti(x,y){

      var id=r.getAttribute('data-id');
      return todos.filter(function(x){return x.id===id})[0];
    }).filter(Boolean);
    var dragged=listTodos[from], targetTodo=listTodos[to];
    if(!dragged||!targetTodo)return;
    todos.splice(todos.indexOf(dragged),1);
    var ti=todos.indexOf(targetTodo);
    if(to>from)ti=ti+1;
    todos.splice(ti,0,dragged);

  }

  /* ---------- long-press a todo row to drag it (whole row, not just the number) ----------
     Press and hold the row text for ~350ms until it lifts, then drag up/down.
     A quick drag still scrolls the page: the hold is cancelled if the finger
     moves more than 10px before the timer fires. While a long-press drag is
     active, touchmove is cancelled so the page does not scroll underneath. */
  var rowHold=null;
  $app.addEventListener('pointerdown',function(e){
    if(e.target.closest('.num')||e.target.closest('button')||e.target.closest('input,textarea'))return;
    var row=e.target.closest('li.fold-row'); if(!row)return;
    if(e.pointerType==='mouse'&&e.button!==0)return;
    var list=rowListOf(row); if(!list)return;
    var rows=rowEls(list);
    rowHold={row:row,list:list,rows:rows,pid:e.pointerId,y0:e.clientY,x0:e.clientX,
      timer:setTimeout(function(){
        if(!rowHold)return;
        var h=rowHold; rowHold=null;
        var r=h.row;
        rowDrag={id:r.getAttribute('data-id'),row:r,list:h.list,rows:h.rows,idx:h.rows.indexOf(r),
          y0:h.y0,top0:r.offsetTop,h:r.offsetHeight,
          tops:h.rows.map(function(x){return x.offsetTop}),
          hs:h.rows.map(function(x){return x.offsetHeight}),
          moved:false,pid:h.pid,target:h.rows.indexOf(r),
          done:r.classList.contains('done'),longPress:true};
        r.style.transform='scale(1.02)';
        r.style.zIndex='5';
        r.style.boxShadow='0 8px 20px rgba(0,0,0,.18)';
        if(navigator.vibrate){try{navigator.vibrate(10)}catch(_){}}
        try{r.setPointerCapture(h.pid)}catch(_){}
      },350)};
  });
  $app.addEventListener('pointermove',function(e){
    if(rowHold&&e.pointerId===rowHold.pid){
      if(Math.abs(e.clientY-rowHold.y0)>10||Math.abs(e.clientX-rowHold.x0)>10){
        clearTimeout(rowHold.timer); rowHold=null;
      }
    }
  });
  $app.addEventListener('pointerup',function(e){
    if(rowHold&&e.pointerId===rowHold.pid){clearTimeout(rowHold.timer);rowHold=null;}
  });
  $app.addEventListener('pointercancel',function(e){
    if(rowHold&&e.pointerId===rowHold.pid){clearTimeout(rowHold.timer);rowHold=null;}
  });
  $app.addEventListener('touchmove',function(e){
    if(rowDrag&&rowDrag.longPress)e.preventDefault();
  },{passive:false});

  /* ---------- voice input: browser speech recognition (zh-CN) ----------
     Tap the mic, speak, and the words land in the input — review them,
     then tap 添加. Works in Chrome/Edge and Safari 17+. If the browser
     has no recogniser, the mic shows a hint instead of failing silently. */
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  var rec=null, listening=false, voiceBtn=null;
  function setListening(on,btn){
    listening=on;
    if(btn)voiceBtn=btn;
    var b=voiceBtn; if(!b)return;
    b.classList.toggle('on',on);
    b.setAttribute('aria-pressed',on?'true':'false');
    b.setAttribute('aria-label',on?'正在听…再点一下停止':'语音输入');
  }
  function stopVoice(){if(rec){try{rec.stop()}catch(_){}} setListening(false)}
  function toggleVoice(btn,inp){
    if(!SR){toast('这个浏览器不支持语音输入，换 Chrome 或更新 iOS 再试');return}
    if(listening){stopVoice();return}
    if(!inp)return;
    voiceBtn=btn;
    rec=new SR();
    rec.lang='zh-CN';
    rec.interimResults=true;
    rec.continuous=false;
    rec.onresult=function(e){
      var txt='';
      for(var i=0;i<e.results.length;i++)txt+=e.results[i][0].transcript;
      inp.value=txt;
    };
    rec.onend=function(){setListening(false)};
    rec.onerror=function(ev){
      setListening(false);
      if(ev.error==='aborted')return;
      var m={
        'not-allowed':'麦克风没开权限，点地址栏旁边的锁打开',
        'no-speech':'没听到声音，再说一遍',
        'audio-capture':'找不到麦克风',
        'network':'网络连不上语音服务，检查一下网络再试',
        'service-not-allowed':'这个浏览器里语音服务不可用，换 Safari 或 Chrome 打开试试'
      }[ev.error];
      toast(m||('语音识别失败：'+ev.error+'，再试一次'));
    };
    try{rec.start();setListening(true,btn)}catch(_){setListening(false)}
  }

  /* ---------- events ---------- */
  $app.addEventListener('click',function(e){
    var f=e.target.closest('a[data-focus]');
    if(f){pendingFocus=f.getAttribute('data-focus');sfx('nav');return}
    if(e.target.closest('a.back')){sfx('nav');return}
    var fb=e.target.closest('.fold-band');
    if(fb){
      if(e.detail===0){var fk=fb.getAttribute('data-fold');animateTo(fk,isOpen[fk]?0:1)}
      return;
    }
    var el=e.target.closest('[data-act]'); if(!el)return;
    var act=el.getAttribute('data-act');
    var row=el.closest('[data-id]');
    var id=row?row.getAttribute('data-id'):null;
    var t;
    if(act==='toggle'){
      t=todos.filter(function(x){return x.id===id})[0]; if(!t)return;
      t.done=!t.done; sfx(t.done?'done':'undo');
      if(t.done)confetti(e.clientX||innerWidth/2,e.clientY||innerHeight/2);
      save(K.todo,todos); updateTodo();
    }else if(act==='today'){
      t=todos.filter(function(x){return x.id===id})[0]; if(!t)return;
      t.today=!t.today; sfx('tick'); save(K.todo,todos); updateTodo();
    }else if(act==='del'){
      t=todos.filter(function(x){return x.id===id})[0]; if(!t)return;
      todos.splice(todos.indexOf(t),1); sfx('del'); save(K.todo,todos); updateTodo();
    }else if(act==='clear-done'){
      for(var ci=todos.length-1;ci>=0;ci--){if(todos[ci].done)todos.splice(ci,1);}
      sfx('clear'); save(K.todo,todos); updateTodo();
    }else if(act==='restore-todo'){
      t=todos.filter(function(x){return x.id===id})[0]; if(!t)return;
      t.done=false; t.today=false; sfx('restore'); save(K.todo,todos); updateTodo();
    }else if(act==='edit'){
      t=todos.filter(function(x){return x.id===id})[0]; if(!t)return;
      var rowEl=el.closest('li.fold-row'); if(!rowEl)return;
      var tSpan=rowEl.querySelector('.t'); if(!tSpan)return;
      if(rowEl.querySelector('.edit-input'))return;
      var oldText=t.text;
      var inp=document.createElement('input');
      inp.type='text'; inp.className='edit-input'; inp.value=oldText;
      inp.setAttribute('aria-label','编辑待办事项');
      tSpan.textContent=''; tSpan.appendChild(inp);
      inp.focus();
      try{inp.setSelectionRange(inp.value.length,inp.value.length)}catch(_){}
      var editDone=false;
      var finishEdit=function(saveIt){
        if(editDone)return; editDone=true;
        var v=inp.value.trim();
        if(saveIt&&v&&v!==oldText){t.text=v; save(K.todo,todos);}
        updateTodo();
      };
      inp.addEventListener('keydown',function(ev){
        if(ev.key==='Enter'){ev.preventDefault(); finishEdit(true);}
        else if(ev.key==='Escape'){ev.preventDefault(); finishEdit(false);}
      });
      inp.addEventListener('blur',function(){finishEdit(true);});
    }else if(act==='voice'){
      var form=el.closest('form');
      toggleVoice(el,form?form.querySelector('input'):null);
    }else if(act==='shopcat'){
      shopCat=el.getAttribute('data-cat');
      var sibs=el.parentNode.querySelectorAll('[data-act="shopcat"]');
      for(var k=0;k<sibs.length;k++)sibs[k].setAttribute('aria-pressed',sibs[k]===el?'true':'false');
      sfx('tick');
    }else if(act==='chip'){
      sfx('tick'); ui[el.getAttribute('data-group')]=el.getAttribute('data-val');
      var sibs=el.parentNode.querySelectorAll('.chip');
      for(var k=0;k<sibs.length;k++)sibs[k].setAttribute('aria-pressed',sibs[k]===el?'true':'false');
      renderShopLists();
    }else if(act==='move-up'){
      moveShop(id,-1);
    }else if(act==='move-down'){
      moveShop(id,1);
    }else if(act==='card-menu'){
      openCardMenu(id);
    }else if(act==='buy'){
      sfx('buy'); bought[id]=Date.now(); save(K.bought,bought); renderShopLists();
    }else if(act==='restore'){
      sfx('restore'); delete bought[id]; save(K.bought,bought); renderShopLists();
    }else if(act==='clear'){
      sfx('clear'); Object.keys(bought).forEach(function(b){if(gone.indexOf(b)<0)gone.push(b)});
      bought={}; save(K.bought,bought); save(K.gone,gone); renderShopLists();
    }else if(act==='pic'){
      pendingImg=id; document.getElementById('imgInput').click();
    }
  });

  $app.addEventListener('submit',function(e){
    if(e.target.id==='addForm'){
      e.preventDefault();
      stopVoice();
      var inp=document.getElementById('newTodo');
      var text=inp.value.trim(); if(!text)return;
      sfx('pop'); todos.unshift({id:uid(),text:text,done:false,today:false});
      save(K.todo,todos);
      inp.value='';
      updateTodo();
      if(!isOpen.all)animateTo('all',1);
    }else if(e.target.id==='shopAddForm'){
      e.preventDefault();
      stopVoice();
      var inp2=document.getElementById('newItem');
      var text2=inp2.value.trim(); if(!text2)return;
      sfx('pop');
      custom.unshift({id:uid(),cat:shopCat,name:text2,place:'',type:'',price:'待定',note:''});
      save(K.custom,custom);
      inp2.value='';
      renderShopLists();
    }
  });

  document.getElementById('imgInput').addEventListener('change',function(e){
    var file=e.target.files&&e.target.files[0]; var id=pendingImg; e.target.value='';
    if(!file||!id)return;
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var s=Math.min(1,600/Math.max(im.width,im.height));
      var c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      imgs[id]=c.toDataURL('image/jpeg',.82);
      sfx('shutter');
      if(!save(K.img,imgs))toast('图片换上了，但这台设备存不下，刷新后会消失。');
      renderShopLists();
    };
    im.onerror=function(){URL.revokeObjectURL(url);toast('这张图读不出来，换一张试试。')};
    im.src=url;
  });

  route();
})();
</script>
</body>
</html>
